[package]
name = "flowy"
version = "0.4.1"
edition = "2024"

[[bin]]
name = "flowy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["cargo"] }
clap_complete = "4"
comfy-table = "7"
crossterm = "0.29"
nucleo-matcher = "0.3"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tiny_http = "0.12.0"
maud = "0.27.0"
form_urlencoded = "1.2.2"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
percent-encoding = "2.3.2"

[dev-dependencies]
assert_cmd = "2"
form_urlencoded = "1.2.2"
predicates = "3"
tempfile = "3"
